name: Hamrai Khabar daily

on:
  schedule:
    - cron: "15 1 * * *"    # बिहान ७:०० (नेपाल) -> morning
    - cron: "15 13 * * *"   # बेलुका ७:०० (नेपाल) -> afternoon
  workflow_dispatch:
    inputs:
      mode:
        description: "morning वा afternoon"
        default: "morning"
        type: choice
        options: [morning, afternoon]

concurrency:
  group: hamrai-khabar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '15 13 * * *' && 'afternoon' || 'morning') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'auto' }}
        run: python main.py "$MODE"

      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python publish_reel.py

      - name: Save video file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.MODE }}-${{ github.run_number }}
          path: |
            out/final_*.mp4
            out/thumb_*.jpg
          if-no-files-found: ignore
          retention-days: 3
