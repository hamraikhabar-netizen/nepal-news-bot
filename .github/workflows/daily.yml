name: Hamrai Khabar daily

on:
  schedule:
    - cron: "15 1 * * *"    # बिहान ७:०० (नेपाल) -> morning
    - cron: "15 13 * * *"   # बेलुका ७:०० (नेपाल) -> afternoon
  workflow_dispatch:
    inputs:
      mode:
        description: "morning वा afternoon"
        default: "morning"
        type: choice
        options: [morning, afternoon]

concurrency:
  group: hamrai-khabar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '15 13 * * *' && 'afternoon' || 'morning') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0
      - run: pip install -r requirements.txt
      - name: Make video (and upload if YouTube secrets exist)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'auto' }}
        run: python main.py "$MODE"
      - name: Save video file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.MODE }}-${{ github.run_number }}
          path: |
            out/final_*.mp4
            out/thumb_*.jpg
          if-no-files-found: ignore
          retention-days: 3
